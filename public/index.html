<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietnam Trip Split</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2db;--acc:#0f6e5c;--acc2:#e8f3ef;--warn:#b4531a;--warnbg:#fdf0e6}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--ink:#eeede8;--mute:#9c9a92;--line:#33332f;--acc:#4fc3a1;--acc2:#1d322c;--warn:#f0a36b;--warnbg:#3a2a1e}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tabs button,.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.tabs button.on,.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:0}
.row .n{font-weight:600}
.row .s{font-size:12px;color:var(--mute)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--acc)}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--acc2);color:var(--acc);font-weight:600}
.exp{padding:10px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp .top{display:flex;justify-content:space-between;gap:8px}
.exp .meta{font-size:12px;color:var(--mute)}
.exp .acts{margin-top:6px;display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--warn)}
.btn.full{width:100%;padding:11px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:13px;cursor:pointer;user-select:none;background:var(--bg)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cust{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;margin-top:6px}
.cust span{font-size:14px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.warn{background:var(--warnbg);color:var(--warn);padding:8px 10px;border-radius:9px;font-size:13px;margin-top:8px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-size:11px;color:var(--mute);font-weight:600}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.dash{color:var(--line)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
pre{white-space:pre-wrap;font-size:12.5px;background:var(--bg);padding:10px;border-radius:9px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇻🇳 Vietnam Trip Split</h1>
  <div class="sub">Who owes what. All totals in ₹ INR.</div>

  <div class="tabs">
    <button data-t="sum" class="on">Summary</button>
    <button data-t="exp">Expenses</button>
    <button data-t="tally">Tally</button>
  </div>

  <section id="t-sum"></section>
  <section id="t-exp" hidden></section>
  <section id="t-tally" hidden></section>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const PEOPLE=['Amey','Daksha','Tejas','Karishma','Aai','Baba','Dipti','Vaibhav','Yudhan'];
const ADULTS=PEOPLE.filter(p=>p!=='Yudhan');
const COUPLES=[['Amey','Daksha'],['Tejas','Karishma'],['Aai','Baba'],['Dipti','Vaibhav','Yudhan']];
const gname=g=>g.length>2?g.slice(0,-1).join(', ')+' & '+g[g.length-1]:g.join(' & ');
const KEY='vn-split-v1';
const ALL=ADULTS.slice();
const without=(...x)=>ADULTS.filter(p=>!x.includes(p));
const SPA_CUSTOM={Amey:450000,Aai:490000,Baba:490000,Karishma:490000,Daksha:490000,Dipti:490000,Tejas:400000,Vaibhav:400000};
const DEFAULTS={
  rate:273.77, // VND per ₹1 — effective rate from the spa card charge
  expenses:[
    {id:1,date:'2026-11-13',desc:'Lunch',payer:'Tejas',cur:'INR',amount:3021.20,mode:'equal',people:ALL},
    {id:2,date:'2026-11-13',desc:'Dinner – Maazi Duong Thanh',payer:'Tejas',cur:'INR',amount:5087.67,mode:'equal',people:without('Vaibhav')},
    {id:3,date:'2026-11-15',desc:'Lunch – Noi Bai airport',payer:'Tejas',cur:'INR',amount:5199.53,mode:'equal',people:ALL},
    {id:4,date:'2026-11-15',desc:'Dinner – Indian Ganga, Da Nang',payer:'Tejas',cur:'INR',amount:7355.50,mode:'equal',people:ALL},
    {id:5,date:'2026-11-16',desc:'Dinner – Indian restaurant',payer:'Tejas',cur:'INR',amount:4560.28,mode:'equal',people:without('Karishma')},
    {id:6,date:'2026-11-17',desc:'Lunch',payer:'Tejas',cur:'INR',amount:6707,mode:'equal',people:ALL},
    {id:7,date:'2026-11-17',desc:'Dinner – Lifestyle',payer:'Tejas',cur:'INR',amount:6568.20,mode:'equal',people:ALL},
    {id:8,date:'2026-11-17',desc:'Kaki Spa',payer:'Tejas',cur:'VND',amount:3700000,inr:13515.24,mode:'custom',people:ALL,custom:SPA_CUSTOM},
    {id:9,date:'2026-11-18',desc:'Dinner – Banana Leaf, HCMC',payer:'Tejas',cur:'INR',amount:3159.63,mode:'equal',people:without('Amey','Vaibhav')}
  ]
};
// MODE: 'loading' | 'live' (shared db) | 'local' (this device only)
let MODE='loading',canWrite=true,banner='Loading shared data…';
let S={rate:DEFAULTS.rate,expenses:[]};
function loadLocal(){
  let L;try{L=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  S=(L&&Array.isArray(L.expenses))?L:JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){if(MODE==='local'){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}
function goLocal(msg){if(MODE==='live')return;MODE='local';canWrite=true;loadLocal();banner=msg;renderAll()}
async function api(method,path,body){
  const r=await fetch('/api/'+path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));
  return r.json();
}
let busy=0,CHANGES=[],lastSync=0;
function ago(t){const s=Math.max(0,(Date.now()-new Date(t))/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'}
async function refresh(){
  if(busy)return;
  try{const st=await api('GET','state');if(busy)return;MODE='live';banner='';S.rate=+st.rate||S.rate;S.expenses=st.expenses||[];CHANGES=st.changes||[];lastSync=Date.now();renderAll()}
  catch(e){if(MODE!=='live')goLocal("Can't reach the shared data right now — showing a copy on this device.")}
}
async function mutate(fn){busy++;try{await fn();return true}catch(e){toast('Could not save — '+(e.message||'try again'));return false}finally{busy--;refresh()}}
async function putExpense(d){
  if(MODE!=='live'){const i=S.expenses.findIndex(x=>x.id===d.id);if(i>=0)S.expenses[i]=d;else S.expenses.push(d);save();renderAll();return true}
  return mutate(()=>api('PUT','expenses/'+encodeURIComponent(d.id),d));
}
async function removeExpense(id){
  if(MODE!=='live'){S.expenses=S.expenses.filter(x=>x.id!=id);save();renderAll();return}
  S.expenses=S.expenses.filter(x=>x.id!=id);renderAll();
  await mutate(()=>api('DELETE','expenses/'+encodeURIComponent(id)));
}
async function putRate(r){
  S.rate=r;
  if(MODE!=='live'){save();renderAll();return}
  await mutate(()=>api('PUT','rate',{rate:r}));
}
function initShared(){
  refresh();
  setInterval(()=>{if(MODE==='live'&&!document.hidden&&!document.getElementById('modal').classList.contains('open'))refresh()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&MODE==='live')refresh()});
}

const r2=n=>Math.round(n*100)/100;
const fmt=n=>'₹'+(Math.round(n)).toLocaleString('en-IN');
const fmt2=n=>'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const vnd=n=>Math.round(n).toLocaleString('en-US')+' ₫';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function inrTotal(e){
  if(e.cur==='INR')return +e.amount||0;
  return (+e.inr>0)?+e.inr:(+e.amount||0)/(+S.rate||1);
}
// shares in INR per person
function shares(e){
  const T=inrTotal(e),out={};
  if(e.mode==='custom'){
    const sum=PEOPLE.reduce((a,p)=>a+(+(e.custom||{})[p]||0),0);
    PEOPLE.forEach(p=>{const v=+(e.custom||{})[p]||0;if(v>0)out[p]=sum?T*v/sum:0});
  }else{
    const ps=e.people||[];ps.forEach(p=>out[p]=ps.length?T/ps.length:0);
  }
  return out;
}
function compute(){
  const owe={},paid={},share={};PEOPLE.forEach(p=>{owe[p]={};paid[p]=0;share[p]=0});
  let total=0;
  S.expenses.forEach(e=>{
    const T=inrTotal(e),sh=shares(e);total+=T;paid[e.payer]+=T;
    for(const p in sh){share[p]+=sh[p];if(p!==e.payer)owe[p][e.payer]=(owe[p][e.payer]||0)+sh[p]}
  });
  return {owe,paid,share,total};
}

let view='couple';
function renderSum(){
  const c=compute();
  const toTejas=p=>c.owe[p]['Tejas']||0;
  const tejasPaid=c.paid['Tejas'];
  const tkCouple=['Tejas','Karishma'];
  const collect=PEOPLE.filter(p=>!tkCouple.includes(p)).reduce((a,p)=>a+toTejas(p),0);
  let h=(banner?`<div class="warn" style="margin:0 0 12px">${esc(banner)}</div>`:'')+(MODE==='live'?`<div class="note" style="margin:-4px 0 10px">● Live — everyone with the link sees and edits the same numbers${canWrite?'':' (view only)'}</div>`:'')+`<div class="kpis">
    <div class="kpi"><div class="l">Trip total</div><div class="v">${fmt(c.total)}</div></div>
    <div class="kpi"><div class="l">Paid by Tejas</div><div class="v">${fmt(tejasPaid)}</div></div>
    <div class="kpi"><div class="l">To collect</div><div class="v pos">${fmt(collect)}</div></div>
  </div>
  <div class="seg"><button data-v="couple" class="${view==='couple'?'on':''}">By couple</button><button data-v="ind" class="${view==='ind'?'on':''}">Individual</button></div>
  <div class="card">`;
  if(view==='couple'){
    COUPLES.forEach(cp=>{
      const v=cp.reduce((a,p)=>a+toTejas(p),0);
      const own=cp.includes('Tejas');
      h+=`<div class="row"><div><div class="n">${gname(cp.filter(p=>p!=='Yudhan'||toTejas(p)>0))}</div><div class="s">${cp.filter(p=>p!=='Yudhan'||toTejas(p)>0).map(p=>p+' '+fmt(toTejas(p))).join(' · ')}</div></div>
      <div>${own?`<span class="tag">Tejas's own</span><div class="s" style="text-align:right">share ${fmt(v+c.share['Tejas'])}</div>`:`<span class="amt pos">${fmt(v)}</span>`}</div></div>`;
    });
  }else{
    PEOPLE.forEach(p=>{
      if(p==='Yudhan'&&!c.share[p])return;
      if(p==='Tejas'){h+=`<div class="row"><div><div class="n">Tejas</div><div class="s">Paid ${fmt(tejasPaid)} · own share ${fmt(c.share.Tejas)}</div></div><span class="tag">Payer</span></div>`;return}
      const v=toTejas(p);
      h+=`<div class="row"><div><div class="n">${p}</div><div class="s">Owes Tejas${p==='Karishma'?' (same couple)':''}</div></div><span class="amt ${p==='Karishma'?'':'pos'}">${fmt2(v)}</span></div>`;
    });
  }
  h+=`</div>`;
  // other payers, if any
  const others=PEOPLE.filter(p=>p!=='Tejas'&&c.paid[p]>0);
  if(others.length){
    h+=`<div class="card"><div class="n" style="font-weight:700;margin-bottom:4px">Other payers</div>`;
    others.forEach(q=>PEOPLE.forEach(p=>{const v=c.owe[p][q]||0;if(v>0)h+=`<div class="row"><div>${p} → ${q}</div><span class="amt">${fmt2(v)}</span></div>`}));
    h+=`</div>`;
  }
  if(MODE==='live'){
    h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Recent changes</b><span class="s" style="font-size:12px;color:var(--mute)">synced ${lastSync?ago(lastSync):'—'}</span></div>`;
    if(!CHANGES.length)h+=`<div class="note">No changes yet. Anything added, edited or deleted shows up here for everyone.</div>`;
    const icon={added:'＋',edited:'✎',deleted:'✕',rate:'₫'};
    CHANGES.slice(0,10).forEach(x=>{h+=`<div class="row"><div><div class="n" style="font-weight:600">${icon[x.action]||''} ${x.action==='rate'?esc(x.desc):esc(x.action[0].toUpperCase()+x.action.slice(1))+': '+esc(x.desc||'')}</div>${x.date?`<div class="s">${esc(x.date.slice(8))}/${esc(x.date.slice(5,7))}${x.amount?' · '+esc(x.amount):''}</div>`:''}</div><span class="s" style="white-space:nowrap">${ago(x.at)}</span></div>`});
    h+=`</div>`;
  }
  h+=`<button class="btn full" id="copy">Copy summary for WhatsApp</button>
  <div class="note">Spa is split using the actual card charge (₹13,515.24 for 3,700,000 ₫), so the forex markup is shared proportionally. Couples: Amey & Daksha, Tejas & Karishma, Aai & Baba, Dipti & Vaibhav (+ Yudhan when added).</div>`;
  document.getElementById('t-sum').innerHTML=h;
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;renderSum()});
  document.getElementById('copy').onclick=()=>copySummary(c);
}
function copySummary(c){
  const t=p=>c.owe[p]['Tejas']||0;
  let s=`Vietnam trip – owed to Tejas\nTrip total: ${fmt(c.total)}\n\n`;
  COUPLES.filter(cp=>!cp.includes('Tejas')).forEach(cp=>{s+=`${gname(cp.filter(p=>p!=='Yudhan'||t(p)>0))}: ${fmt(cp.reduce((a,p)=>a+t(p),0))} (${cp.filter(p=>p!=='Yudhan'||t(p)>0).map(p=>p+' '+fmt(t(p))).join(', ')})\n`});
  s+=`\nItems:\n`;
  S.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>s+=`${e.date.slice(8)}/${e.date.slice(5,7)} ${e.desc}: ${fmt(inrTotal(e))}\n`);
  const done=()=>toast('Copied');
  try{navigator.clipboard.writeText(s).then(done,()=>showText(s))}catch(e){showText(s)}
}
function showText(s){openSheet(`<div class="n" style="font-weight:700">Copy this</div><pre>${esc(s)}</pre><button class="btn full" onclick="closeSheet()">Close</button>`)}

function renderExp(){
  let h=canWrite?`<button class="btn p full" id="add">+ Add expense</button><div class="card" style="margin-top:12px">`:`<div class="card">`;
  const list=S.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length)h+=`<div class="s">No expenses yet.</div>`;
  list.forEach(e=>{
    const sh=shares(e),n=Object.keys(sh).length;
    const excl=ADULTS.filter(p=>!(p in sh));const kid=('Yudhan' in sh)?' · incl. Yudhan':'';
    h+=`<div class="exp"><div class="top"><div><div class="n" style="font-weight:600">${esc(e.desc)}</div>
      <div class="meta">${e.date.slice(8)}/${e.date.slice(5,7)} · paid by ${e.payer} · ${e.mode==='custom'?'custom split':n+' people'}${excl.length?' · excl. '+excl.join(', '):''}${kid}</div>
      ${e.cur==='VND'?`<div class="meta">${vnd(e.amount)}${+e.inr>0?' · card charge':' @ '+S.rate+' ₫/₹'}</div>`:''}</div>
      <div class="amt">${fmt2(inrTotal(e))}</div></div>
      ${canWrite?`<div class="acts"><button class="btn" data-ed="${e.id}">Edit</button><button class="btn d" data-del="${e.id}">Delete</button></div>`:''}</div>`;
  });
  h+=`</div><div class="card"><label style="margin-top:0">Default VND per ₹1 (used when no card charge is entered)</label>
  <input id="rate" type="number" step="0.01" inputmode="decimal" value="${S.rate}" ${canWrite?'':'disabled'}>
  <div class="note">273.77 is the effective rate from the Scapia spa charge, which includes card markup.</div></div>
  ${MODE==='local'?'<button class="btn d full" id="reset">Reset to original trip data</button>':''}`;
  document.getElementById('t-exp').innerHTML=h;
  const add=document.getElementById('add');if(add)add.onclick=()=>editor();
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editor(S.expenses.find(x=>x.id==b.dataset.ed)));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmBox('Delete this expense for everyone?',()=>removeExpense(b.dataset.del)));
  document.getElementById('rate').onchange=ev=>{const r=+ev.target.value;if(r>0&&r!==S.rate)putRate(r)};
  const rs=document.getElementById('reset');if(rs)rs.onclick=()=>confirmBox('Reset everything to the original trip data? Your edits will be lost.',()=>{S=JSON.parse(JSON.stringify(DEFAULTS));save();renderAll()});
}

function renderTally(){
  const c=compute();
  const TP=PEOPLE.filter(p=>p!=='Yudhan'||c.share[p]||c.paid[p]);
  const list=S.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date));
  let h=`<div class="card tbl"><table><thead><tr><th>Expense</th><th>Total</th>${TP.map(p=>`<th>${p}</th>`).join('')}</tr></thead><tbody>`;
  list.forEach(e=>{const sh=shares(e);
    h+=`<tr><td>${e.date.slice(8)}/${e.date.slice(5,7)} ${esc(e.desc.split(' –')[0])}</td><td>${fmt2(inrTotal(e))}</td>${TP.map(p=>p in sh?`<td>${fmt2(sh[p])}</td>`:`<td class="dash">—</td>`).join('')}</tr>`});
  h+=`</tbody><tfoot><tr><td>Total share</td><td>${fmt2(c.total)}</td>${TP.map(p=>`<td>${fmt2(c.share[p])}</td>`).join('')}</tr>
  <tr><td>Paid</td><td></td>${TP.map(p=>`<td>${c.paid[p]?fmt2(c.paid[p]):'—'}</td>`).join('')}</tr>
  <tr><td>Net</td><td></td>${TP.map(p=>{const n=c.paid[p]-c.share[p];return `<td class="${n>0?'pos':''}">${n>0?'+':''}${fmt2(n)}</td>`}).join('')}</tr></tfoot></table></div>
  <div class="note">Net: + means others owe them; − means they owe. Scroll sideways to see everyone. Shares sum exactly to the total (check: ${fmt2(PEOPLE.reduce((a,p)=>a+c.share[p],0))}).</div>`;
  document.getElementById('t-tally').innerHTML=h;
}

function editor(e){
  const isNew=!e;
  const d=e?JSON.parse(JSON.stringify(e)):{id:'e'+Date.now(),date:new Date().toISOString().slice(0,10),desc:'',payer:'Tejas',cur:'INR',amount:'',inr:'',mode:'equal',people:ALL.slice(),custom:{}};
  d.custom=d.custom||{};
  function draw(){
    const cs=PEOPLE.reduce((a,p)=>a+(+d.custom[p]||0),0);
    let h=`<div style="display:flex;justify-content:space-between;align-items:center"><b>${isNew?'Add':'Edit'} expense</b><button class="btn" id="x">✕</button></div>
    <label>Description</label><input id="f-desc" value="${esc(d.desc)}" placeholder="e.g. Dinner">
    <div class="g2"><div><label>Date</label><input id="f-date" type="date" value="${d.date}"></div>
    <div><label>Paid by</label><select id="f-payer">${PEOPLE.map(p=>`<option ${p===d.payer?'selected':''}>${p}</option>`).join('')}</select></div></div>
    <label>Currency</label><div class="seg"><button data-c="INR" class="${d.cur==='INR'?'on':''}">₹ INR</button><button data-c="VND" class="${d.cur==='VND'?'on':''}">₫ VND</button></div>
    <label>Amount (${d.cur})</label><input id="f-amt" type="number" inputmode="decimal" step="any" value="${d.amount}">
    ${d.cur==='VND'?`<label>Actual ₹ charged on card (optional, most accurate)</label><input id="f-inr" type="number" inputmode="decimal" step="any" value="${d.inr||''}" placeholder="blank = use ${S.rate} ₫/₹">`:''}
    <label>Split</label><div class="seg"><button data-m="equal" class="${d.mode==='equal'?'on':''}">Equal</button><button data-m="custom" class="${d.mode==='custom'?'on':''}">Custom amounts</button></div>`;
    if(d.mode==='equal'){
      h+=`<div class="chips">${PEOPLE.map(p=>`<span class="chip ${d.people.includes(p)?'on':''}" data-p="${p}">${p}</span>`).join('')}</div>
      <div class="note">${d.people.length} people · ${d.people.length&&d.amount?(d.cur==='INR'?fmt2(d.amount/d.people.length):vnd(d.amount/d.people.length))+' each':''}</div>`;
    }else{
      h+=PEOPLE.map(p=>`<div class="cust"><span>${p}</span><input data-cu="${p}" type="number" inputmode="decimal" step="any" value="${d.custom[p]||''}" placeholder="0"></div>`).join('');
      h+=`<div class="note">Enter each person's amount in ${d.cur}. Sum: ${d.cur==='INR'?fmt2(cs):vnd(cs)}</div>`;
      if(d.amount&&Math.abs(cs-d.amount)>0.5)h+=`<div class="warn">Custom amounts don't add up to the total (${d.cur==='INR'?fmt2(+d.amount):vnd(+d.amount)}). They'll be scaled to fit the total.</div>`;
    }
    h+=`<div style="margin-top:14px"><button class="btn p full" id="sv">Save</button></div>`;
    document.getElementById('sheet').innerHTML=h;
    const g=id=>document.getElementById(id);
    const sync=()=>{d.desc=g('f-desc').value;d.date=g('f-date').value;d.payer=g('f-payer').value;d.amount=g('f-amt').value;if(g('f-inr'))d.inr=g('f-inr').value;document.querySelectorAll('[data-cu]').forEach(i=>d.custom[i.dataset.cu]=i.value)};
    g('x').onclick=closeSheet;
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sync();d.cur=b.dataset.c;draw()});
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sync();d.mode=b.dataset.m;draw()});
    document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{sync();const p=b.dataset.p;d.people=d.people.includes(p)?d.people.filter(x=>x!==p):PEOPLE.filter(x=>d.people.includes(x)||x===p);draw()});
    g('f-amt').oninput=()=>{sync()};
    g('f-amt').onchange=()=>{sync();draw()};
    document.querySelectorAll('[data-cu]').forEach(i=>i.onchange=()=>{sync();draw()});
    g('sv').onclick=async()=>{
      sync();d.amount=+d.amount;d.inr=+d.inr||'';
      if(d.mode==='custom'){const s=PEOPLE.reduce((a,p)=>a+(+d.custom[p]||0),0);if(!d.amount&&s)d.amount=s;for(const p in d.custom){d.custom[p]=+d.custom[p]||0;if(!d.custom[p])delete d.custom[p]}if(!s)return toast('Enter at least one amount')}
      else if(!d.people.length)return toast('Pick at least one person');
      if(!d.amount)return toast('Enter an amount');
      if(!d.desc)d.desc='Expense';
      g('sv').disabled=true;
      const ok=await putExpense(d);
      if(ok){closeSheet();toast('Saved')}else g('sv').disabled=false;
    };
  }
  draw();openSheet();
}
function openSheet(html){if(html)document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeSheet(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').onclick=ev=>{if(ev.target.id==='modal')closeSheet()};
function confirmBox(msg,ok){openSheet(`<p>${esc(msg)}</p><div class="g2"><button class="btn" id="cn">Cancel</button><button class="btn p" id="ok">Yes</button></div>`);document.getElementById('cn').onclick=closeSheet;document.getElementById('ok').onclick=()=>{closeSheet();ok()}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500)}

document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));['sum','exp','tally'].forEach(t=>document.getElementById('t-'+t).hidden=t!==b.dataset.t)});
function renderAll(){renderSum();renderExp();renderTally()}
renderAll();
initShared();
</script>
</body>
</html>
